<!doctype html>
<!-- Shown by the window while the wizard's server starts (main.start_window).
     Self-contained: nothing is being served yet. Colours are app.css's. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Lab Wizard</title>
		<style>
			:root {
				--ground: #f7f7fb;
				--ink: #16162b;
				--muted: #6c6c8a;
				--line: #e2e2ec;
				--accent: #4536d9;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--ground: #0c0c16;
					--ink: #e8e8f2;
					--muted: #8484a0;
					--line: #232336;
					--accent: #8f86f5;
				}
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: var(--ground);
				color: var(--ink);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				cursor: default;
				user-select: none;
				-webkit-user-select: none;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
			}
			.brand svg {
				width: 32px;
				height: 32px;
			}
			.brand span {
				font-size: 14px;
				font-weight: 600;
				letter-spacing: 0.13em;
				text-transform: uppercase;
			}
			.track {
				position: relative;
				width: 160px;
				height: 3px;
				margin-top: 24px;
				overflow: hidden;
				border-radius: 2px;
				background: var(--line);
			}
			.track::after {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 40%;
				height: 100%;
				border-radius: 2px;
				background: var(--accent);
				animation: slide 1.1s ease-in-out infinite;
			}
			@keyframes slide {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
			p {
				margin: 12px 0 0;
				font-size: 12px;
				color: var(--muted);
			}
			/* Hidden for the first moment, so a fast start never flashes it. */
			.brand,
			.track,
			p {
				animation: appear 200ms ease 250ms both;
			}
			@keyframes appear {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<div class="brand">
			<svg viewBox="0 0 464 464" fill="none" aria-hidden="true">
				<path
					d="M413.504 340.132C413.504 347.632 371.004 368.632 225.504 368.632C149.504 370.914 49.5035 351.132 50.5035 340.132C51.5035 329.132 139.004 313.132 151.504 302.132C164.004 291.132 146.503 224.634 196.503 142.134C236.503 76.1343 315.004 45.1346 351.003 68.6347C298.503 68.6347 290.003 142.133 287.003 182.134C287.003 182.134 287.003 266.135 324.504 307.632C340.796 325.661 413.504 332.632 413.504 340.132Z"
					stroke="#4F41EF"
					stroke-width="33"
					stroke-linejoin="round"
				/>
				<path
					d="M134.003 310.635L220.003 288.635"
					stroke="#4F41EF"
					stroke-width="33"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
			</svg>
			<span>Lab Wizard</span>
		</div>
		<div class="track" role="progressbar" aria-label="Starting"></div>
		<p>Starting…</p>
	</body>
</html>
