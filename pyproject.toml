[project]
name = "lab-wizard-repo"
version = "0.1.0"
description = "Main SNSPD wizard app"
requires-python = ">=3.13"
dependencies = ["lab-wizard", "lab-procedure", "ruamel-yaml>=0.18.16"]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab_wizard"]

[tool.uv]
package = true
# Older Linux (glibc 2.17, e.g. RHEL/CentOS 7) has no prebuilt wheels for these
# packages' newer releases, so uv would try to compile them from source. These
# caps keep them at releases that ship manylinux2014 wheels for Python 3.13.
constraint-dependencies = ["numpy<2.3", "contourpy<1.3.3", "matplotlib<3.12", "pyzmq<27"]

[project.scripts]
wizard = "lab_wizard.wizard.cli:main"

[tool.uv.workspace]
members = ["lab_wizard", "procedure_framework"]

[tool.uv.sources]
lab-wizard = { workspace = true, editable = true }
lab-procedure = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ty>=0.0.81",
    "zensical>=0.0.43",
]

[tool.ty.environment]
# lab_procedure is a workspace member whose package lives one level down, under
# procedure_framework/; the editable install's import hook is invisible to ty.
extra-paths = ["procedure_framework"]

[tool.pytest.ini_options]
# ref/ holds vendored projects with test suites of their own.
testpaths = ["tests"]

[tool.ty.src]
# ref/ holds vendored and legacy reference code, not this project's source.
exclude = ["ref", "site", "projects", "lab_wizard/wizard/frontend"]
