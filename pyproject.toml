[project]
name = "lab-wizard-repo"
version = "0.1.0"
description = "Main SNSPD wizard app"
requires-python = ">=3.14"
dependencies = ["lab-wizard", "lab-procedure", "ruamel-yaml>=0.18.16"]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab_wizard"]

[tool.uv]
package = true

[project.scripts]
wizard = "lab_wizard.wizard.cli:main"

[tool.uv.workspace]
members = ["lab_wizard", "procedure_framework"]

[tool.uv.sources]
lab-wizard = { workspace = true, editable = true }
lab-procedure = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ty>=0.0.81",
    "zensical>=0.0.43",
]

[tool.ty.environment]
# lab_procedure is a workspace member whose package lives one level down, under
# procedure_framework/; the editable install's import hook is invisible to ty.
extra-paths = ["procedure_framework"]

[tool.pytest.ini_options]
# ref/ holds vendored projects with test suites of their own.
testpaths = ["tests"]

[tool.ty.src]
# ref/ holds vendored and legacy reference code, not this project's source.
exclude = ["ref", "site", "projects", "lab_wizard/wizard/frontend"]
