[project]
name = "lab-sim"
version = "0.0.1"
description = "A simulated SNSPD test bench that lab_wizard's real instrument drivers can talk to."
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml"]

[project.scripts]
lab-sim = "lab_sim.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lab_sim*"]
